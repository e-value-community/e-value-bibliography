title: E-values as unnormalized weights in multiple testing
authors: Nikolaos Ignatiadis, Ruodu Wang, Aaditya Ramdas
year: 2024
doi: 10.1093/biomet/asad057
abstract: >-
  We study how to combine p-values and e-values, and design multiple testing procedures where both
  p-values and e-values are available for every hypothesis. Our results provide a new perspective
  on multiple testing with data-driven weights: while standard weighted multiple testing methods
  require the weights to deterministically add up to the number of hypotheses being tested, we
  show that this normalization is not required when the weights are e-values that are independent
  of the p-values. Such e-values can be obtained in the meta-analysis setting wherein a primary
  dataset is used to compute p-values, and an independent secondary dataset is used to compute
  e-values. Going beyond meta-analysis, we showcase settings wherein independent e-values and
  p-values can be constructed on a single dataset itself. Our procedures can result in a
  substantial increase in power, especially if the non-null hypotheses have e-values much larger
  than one.
