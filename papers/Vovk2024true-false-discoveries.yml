title: True and false discoveries with independent and sequential e-values
authors: Vladimir Vovk, Ruodu Wang
year: 2024
doi: 10.1002/cjs.11833
abstract: >-
  In this paper we use e-values in the context of multiple hypothesis testing assuming that the
  base tests produce independent, or sequential, e-values. Our simulation and empirical studies
  and theoretical considerations suggest that, under this assumption, our new algorithms are
  superior to the known algorithms using independent p-values and to our recent algorithms
  designed for e-values without the assumption of independence.
