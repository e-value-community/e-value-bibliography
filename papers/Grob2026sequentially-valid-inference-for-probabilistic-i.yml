title: Sequentially valid inference for probabilistic inflation forecasts
authors: Amadeo Grob, Maurizio Daniele, Johanna Ziegel
year: 2026
arxiv: '2608.23064'
abstract: >-
  Traditional statistical tests are poorly suited for the sequential evaluation of probabilistic
  forecast calibration. We address this limitation in macroeconomic forecasting by applying a new
  sequential testing method based on e-values. The e-value-based methodology enables anytime-valid
  inference. It allows practitioners to test against calibration continuously without invalidating
  statistical guarantees. To illustrate the framework's practical value, we apply it to
  probabilistic inflation forecasts for the United States, the Euro Area, and Switzerland. Our
  analysis shows that the sequential approach gives detailed insights into the timing and nature
  of forecast misspecification. We find these diagnostics are particularly insightful during major
  structural breaks. During these events, we find evidence against calibration that static,
  full-sample tests often miss. Therefore, this work shows that e-value-based tests are a
  practical method for the evaluation of forecast calibration in empirical macroeconomics.
