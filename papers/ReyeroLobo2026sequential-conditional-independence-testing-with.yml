title: Sequential Conditional Independence Testing with Machine Learning Models
authors: Angel Reyero-Lobo, Michele Meziu, Sebastian Uriel Arias, Peter Grünwald
year: 2026
arxiv: '2610.11388'
abstract: >-
  Conditional independence testing is a ubiquitous problem in scientific discovery. The widely
  employed model-X assumption shifts the modelling burden from the dependence of the output on the
  inputs to the dependencies within the inputs. Log-optimal e-variables have been studied in this
  setting, but it remains unclear how to incorporate machine learning models into their design.
  Other approaches test exchangeability directly, yielding an e-variable with lower power in
  theory but, surprisingly, higher power in practice. We explain this phenomenon by decomposing
  the error into null enlargement, approximation, and estimation error. The decomposition shows
  that GRO e-variable estimates can be beaten because of their worse approximation and estimation
  errors, and we explore intermediate null hypotheses between model-X conditional independence and
  exchangeability to reduce these errors. Moreover, the model-X assumption often only holds up to
  an estimation error, invalidating exact type-I error guarantees. We provide estimation error
  bounds that accommodate triple robustness results, achieving fast convergence rates.
