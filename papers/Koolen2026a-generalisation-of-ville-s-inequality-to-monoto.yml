title: A Generalisation of Ville's Inequality to Monotonic Lower Bounds and Thresholds
authors: Wouter M. Koolen, Muriel Felipe Pérez-Ortiz, Tyron Lardy
year: 2026
doi: 10.1016/j.spl.2025.110577
arxiv: '2502.16019'
abstract: >-
  Essentially all anytime-valid methods hinge on Ville's inequality to gain validity across time
  without incurring a union bound. Ville's inequality is a proper generalisation of Markov's
  inequality. It states that a non-negative supermartingale will only ever reach a multiple of its
  initial value with small probability. In the classic rendering both the lower bound (of zero)
  and the threshold are constant in time. We generalise both to monotonic curves. That is, we
  bound the probability that a supermartingale which remains above a given decreasing curve
  exceeds a given increasing threshold curve. We show our bound is tight by exhibiting a
  supermartingale for which the bound is an equality. Using our generalisation, we derive a clean
  finite-time version of the law of the iterated logarithm.
