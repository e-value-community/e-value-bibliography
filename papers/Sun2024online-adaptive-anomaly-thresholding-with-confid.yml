title: Online Adaptive Anomaly Thresholding with Confidence Sequences
authors: Sophia Huiwen Sun, Abishek Sankararaman, Balakrishnan Murali Narayanaswamy
year: 2024
abstract: >-
  Sun, Sankararaman, and Narayanaswamy connect online anomaly-threshold selection with confidence
  sequences. Their algorithm adapts to distribution shifts while providing distribution-free
  guarantees on false-positive and false-negative rates. Relevant offline data can warm-start the
  method, while irrelevant offline data causes only bounded degradation; experiments on synthetic
  and real datasets improve on common baselines.
