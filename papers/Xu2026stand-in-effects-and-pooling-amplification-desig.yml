title: >-
  Stand-In Effects and Pooling Amplification: Lessons from Biological World Models for Testing
  Action Effects
authors: Bowen Xu, Boyu Chen, Jiaying Li
year: 2026
arxiv: '2611.01666'
abstract: >-
  Whether an action-conditioned world model responds to actions is usually checked by replacing
  or removing the actions and measuring the loss in accuracy. Taking biological experiments as
  the guiding case, we show that such diagnostics report action effects where there are none:
  under autocorrelated designs, future actions stand in for history the model does not see.
  When the design law is known, a conditional randomization test written as an e-value is valid
  in finite samples whatever the model. A second failure arises whenever many sites share one
  action sequence, as in world models: the pooled score turns small model errors along the
  action contrast into an e-value near zero, so a valid test loses its power although the
  effect is real. Tempering the score changes the bet, not the validity. The log e-value is
  concave in the tempering factor and zero at zero, so too small a factor costs little and too
  large a one can cost everything; every single factor we tried, estimated or tuned, failed in
  some setting, and mixtures over a fixed grid never did. Our own preregistered analysis of
  optogenetic ERK experiments failed by pooling; a tempered statistic, registered before the
  data were obtained, then rejected the null on a never-opened field (E = 1.1e10). In three
  registered tests on models trained by others, the pooled test rejected in 0 of 96 units of a
  diffusion model, and reached the power bar in 10 of 26 Atari games under IRIS's token
  likelihood and 1 of 6 control tasks under TD-MPC2; mixtures fixed in advance reached it in 96
  units, 24 games and 6 tasks. On recorded robot video with iVideoGPT the mixture rejected in
  155 of 159 trajectories; the pooled test did not collapse there (143). Under exact nulls the
  statistics made 14 rejections in 26,664 tests.
