title: 'Anytime-valid, Bayes-assisted, Prediction-Powered Inference'
authors: Valentin Kilian, Stefano Cortinovis, François Caron
year: 2025
doi: 10.52202/085713-0033
arxiv: '2505.18000'
abstract: >-
  Given a large pool of unlabelled data and a smaller amount of labels, prediction-powered
  inference (PPI) leverages machine learning predictions to increase the statistical efficiency of
  confidence interval procedures based solely on labelled data, while preserving fixed-time
  validity. In this paper, we extend the PPI framework to the sequential setting, where labelled
  and unlabelled datasets grow over time. Exploiting Ville's inequality and the method of mixtures,
  we propose prediction-powered confidence sequence procedures that are asymptotically valid
  uniformly over time and naturally accommodate prior knowledge on the quality of the predictions
  to further boost efficiency. We carefully illustrate the design choices behind our method and
  demonstrate its effectiveness in real and synthetic examples.
