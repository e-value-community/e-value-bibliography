title: Enhancement of prediction algorithms by betting
authors: Vladimir Vovk
year: 2021
arxiv: '2105.08669'
abstract: >-
  This note proposes a procedure for enhancing the quality of probabilistic prediction algorithms
  via betting against their predictions. It is inspired by the success of the conformal test
  martingales that have been developed recently.
