title: Optimal Training of the Online Newton Algorithm based on Conformal CUSUM
authors: Thomas Grava, Frédéric Vrins
year: 2026
abstract: >-
  We apply conformal CUSUM to identify the training period of the Online Newton Algorithm in a
  continuous learning setup.Numerical simulations demonstrate the ability of our approach, called
  Lean-ONS, to efficiently detect change-points and identify a relevant training set, which
  improves prediction performance compared to standard alternatives in the literature.
