title: Asymptotically Optimal Sequential Testing with Markovian Data
authors: Alhad Sethi, Kavali Sofia Sagar, Shubhada Agrawal, Debabrota Basu, P. N. Karthik
year: 2026
abstract: >-
  We study one-sided and $α$-correct sequential hypothesis testing for data generated by an
  ergodic, finite-state Markov chain. The null hypothesis is that the unknown transition matrix
  belongs to a prescribed set $P$ of stochastic matrices, and the alternative corresponds to a
  disjoint set $Q$. We establish a non-asymptotic instance-dependent lower bound on the expected
  stopping time of any valid sequential test under the alternative, which is asymptotically tight.
  Our novel analysis improves the existing lower bounds, which are either asymptotic or provably
  sub-optimal in this setting. Our lower bound incorporates both the stationary distribution and
  the transition structure induced by the unknown Markov chain. We further propose an optimal test
  whose expected stopping time matches this lower bound asymptotically as $α\to 0$. We illustrate
  the usefulness of our framework through applications to sequential detection of model
  misspecification in Markov Chain Monte Carlo and to testing structural properties, such as the
  linearity of transition dynamics, in Markov decision processes. Our findings yield a sharp and
  general characterization of optimal sequential testing procedures under Markovian dependence.
