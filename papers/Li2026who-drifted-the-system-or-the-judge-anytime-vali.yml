title: 'Who Drifted: the System or the Judge? Anytime-Valid Attribution in LLM Evaluation Pipelines'
authors: Yitao Li
year: 2026
arxiv: '2606.15474'
abstract: >-
  Continuous evaluation of LLM products relies on a strong LLM judge treated as ground truth: a
  cheap monitor scores every interaction and a team is paged when the score drifts down. But the
  judge is itself a model behind an API, and a silent version bump or scoring-prompt update
  changes how it scores -- so every drift alarm is ambiguous between a worse product and a changed
  judge. We resolve the ambiguity with a fixed, human-labeled anchor set that the current judge
  re-scores at a steady interleave, a second betting e-process on the judge-versus-human gap, and
  a guard-window rule returning a verdict in {none, system, judge}. We prove anytime-validity,
  one-way identification (only the judge can move the anchors), an attribution race whose design
  law is that the anchors must out-run the main process they guard, and process orthogonality. On
  two real judge changes, a silent version bump is detected as judge drift in 60/60 runs with zero
  judge-to-system misattribution, and a contaminating strict-prompt change is correctly attributed
  on 110 of 120 runs at guard width 300 -- while the industry-default rolling z-test false-alarms
  on 75% of drift-free streams. Every experiment replicates on a second domain (TL;DR
  summarization) with nothing re-tuned, and where the domains differ the differences are the ones
  the race predicts: the strict-prompt change shifts scores harder there, so the anchors fire
  faster and attribution becomes perfect (240/240). The monitor runs at approximately 0.64 of the
  cost of strong-judging every item, or 0.21 in a cheaper-but-deafer regime.
