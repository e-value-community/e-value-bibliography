title: 'Ensuring Reliability via Hyperparameter Selection: Review and Advances'
authors: Amirmohammad Farzaneh, Osvaldo Simeone
year: 2025
abstract: >-
  Hyperparameter selection is a critical step in the deployment of artificial intelligence (AI)
  models, particularly in the current era of foundational, pre-trained, models. By framing
  hyperparameter selection as a multiple hypothesis testing problem, recent research has shown
  that it is possible to provide statistical guarantees on population risk measures attained by
  the selected hyperparameter. This paper reviews the Learn-Then-Test (LTT) framework, which
  formalizes this approach, and explores several extensions tailored to engineering-relevant
  scenarios. These extensions encompass different risk measures and statistical guarantees,
  multi-objective optimization, the incorporation of prior knowledge and dependency structures
  into the hyperparameter selection process, as well as adaptivity. The paper also includes
  illustrative applications for communication systems.
