title: Shapley-based fault variable identification in MSPC
authors: Johan Lim, Juwhan Kim, Sungim Lee, Seul Lee
year: 2026
doi: 10.1080/08982112.2026.2637643
abstract: >-
  In multivariate statistical process control, Hotelling’s T2 control chart (HT chart) is a
  powerful tool for detecting shifts in a process’s overall mean. However, when a process falls
  out of control, the HT chart only signals an issue without identifying the specific variables
  responsible for the deviation. To address this limitation, traditional approaches decompose the
  overall T2 statistic into T2 statistics of individual variables or higher-order interaction
  terms. While informative, this approach becomes computationally challenging and less effective
  as the number of variables increases. In this study, we propose a new procedure based on the
  Shapley value, widely applied in machine learning to quantify variable importance in
  predictions. In this approach, we consider the T2 statistic as a value function for each subset
  of variables and employ Shapley sampling and KernelSHAP to estimate Shapley values in high
  dimensional data. Most importantly, we develop a procedure to identify variable causing the out
  of control signal using Shapley values, demonstrating that Shapley values serve as an e-value.
  We numerically compare the performance of this new Shapley-based procedure with two existing
  procedures: the Mason-Tracy-Young and the adaptive step-down procedures. Finally, we apply these
  procedures to detect changes in the monthly temperature of Seoul after the year 2000.
