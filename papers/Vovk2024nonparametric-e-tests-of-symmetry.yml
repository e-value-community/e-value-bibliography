title: Nonparametric E-tests of Symmetry
authors: Vladimir Vovk, Ruodu Wang
year: 2024
doi: 10.51387/24-nejsds60
arxiv: '2208.08925'
abstract: >-
  The notion of an e-value has been recently proposed as a possible alternative to critical
  regions and p-values in statistical hypothesis testing. In this paper we consider testing the
  nonparametric hypothesis of symmetry, introduce analogues for e-values of three popular
  nonparametric tests, define an analogue for e-values of Pitman's asymptotic relative efficiency,
  and apply it to the three nonparametric tests. We discuss limitations of our simple definition
  of asymptotic relative efficiency and list directions of further research.
