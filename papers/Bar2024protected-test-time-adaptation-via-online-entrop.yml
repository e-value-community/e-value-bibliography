title: 'Protected Test-Time Adaptation via Online Entropy Matching: A Betting Approach'
authors: Yarin Bar, Shalev Shaer, Yaniv Romano
year: 2024
doi: 10.52202/079017-2714
arxiv: '2408.07511'
abstract: >-
  We present a novel approach for test-time adaptation via online self-training, consisting of two
  components. First, we introduce a statistical framework that detects distribution shifts in the
  classifier's entropy values obtained on a stream of unlabeled samples. Second, we devise an
  online adaptation mechanism that utilizes the evidence of distribution shifts captured by the
  detection tool to dynamically update the classifier's parameters. The resulting adaptation
  process drives the distribution of test entropy values obtained from the self-trained classifier
  to match those of the source domain, building invariance to distribution shifts. This approach
  departs from the conventional self-training method, which focuses on minimizing the classifier's
  entropy. Our approach combines concepts in betting martingales and online learning to form a
  detection tool capable of quickly reacting to distribution shifts. We then reveal a tight
  relation between our adaptation scheme and optimal transport, which forms the basis of our novel
  self-supervised loss. Experimental results demonstrate that our approach improves test-time
  accuracy under distribution shifts while maintaining accuracy and calibration in their absence,
  outperforming leading entropy minimization methods across various scenarios.
