title: 'CELEUS: Certifiable and Efficient LLM Evaluation via E-Processes'
authors: Zhijian Zhou, Zesheng Ye, Zhaorun Chen, Bo Li, Feng Liu
year: 2026
arxiv: '2606.20820'
abstract: >-
  Can we trust evaluation scores to capture an LLM's true real-world performance? Certifiable
  evaluation answers this question by providing a confidence interval (CI) that covers the
  LLM's true performance with high probability (e.g., 95%). In particular, existing methods
  sequentially select evaluation samples from a fixed pool and keep updating the CI until
  certain conditions are satisfied, e.g., the CI width reaches a target precision. However,
  existing methods are not generally anytime-valid: the claimed coverage (e.g., 95%) may fail
  when CIs are repeatedly updated and used to decide when to stop, leaving a gap between
  theoretical rigor and practice. This paper bridges this gap by proposing CELEUS, a
  Certifiable framework for Efficient LLM evaluation, which leverages E-processes to build
  anytime-valid CIs. Concretely, we propose a new signal that combines two ingredients: (i)
  Uncertainty-guided sampling to select informative samples for evaluation, and (ii)
  Surrogate-assisted approximations for unevaluated samples. We prove that the new signal
  remains unbiased for the evaluation score conditional on the past, enabling
  statistically-grounded and anytime-valid e-process CIs. More importantly, the two ingredients
  reduce estimation variance and help reach the target precision with fewer evaluated samples.
  We also prove that CIs obtained by CELEUS can shrink at a near-parametric rate up to
  logarithmic factors and analyze the oracle variance-optimal sampling rule that motivates the
  empirical uncertainty-guided one. Experiments show that CELEUS reaches the target precision
  using 54-62% fewer evaluated samples than baselines, while preserving anytime-valid coverage.
  Code is available at https://github.com/zyecs/celeus.
