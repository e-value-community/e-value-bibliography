title: Unsupervised Conformal Novelty Detection for Hierarchical Data
authors: Sieun Kim, Seonghun Cho
year: 2026
abstract: >-
  Electric vehicle (EV) battery packs exhibit a natural pack–module–cell hierarchy, which induces
  dependence among measurements within the same module. Such hierarchical dependence poses
  challenges for the direct application of conventional novelty detection methods. To address
  these challenges, we develop conformal e-value procedures for hierarchical novelty detection,
  with the goal of controlling the false discovery rate (FDR) at both the group and unit levels.
  We combine hierarchical conformal score construction with eBH and U-eBH multiple testing
  procedures, and consider split conformal, full conformal, and group-wise conformal regimes. The
  proposed methods are evaluated through simulation studies and an analysis of EV battery pack
  data, where they provide empirical FDR control and detect localized module- and cell-level
  irregularities.
