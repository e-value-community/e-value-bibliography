title: Online Detection of LLM-Generated Texts via Sequential Hypothesis Testing by Betting
authors: Can Chen, Jun-Kun Wang
year: 2025
arxiv: '2410.22318'
abstract: >-
  Developing algorithms to differentiate between machine-generated texts and human-written texts
  has garnered substantial attention in recent years. Existing methods in this direction typically
  concern an offline setting where a dataset containing a mix of real and machine-generated texts
  is given upfront, and the task is to determine whether each sample in the dataset is from a
  large language model (LLM) or a human. However, in many practical scenarios, sources such as
  news websites, social media accounts, and online forums publish content in a streaming fashion.
  Therefore, in this online scenario, how to quickly and accurately determine whether the source
  is an LLM with strong statistical guarantees is crucial for these media or platforms to function
  effectively and prevent the spread of misinformation and other potential misuse of LLMs. To
  tackle the problem of online detection, we develop an algorithm based on the techniques of
  sequential hypothesis testing by betting that not only builds upon and complements existing
  offline detection techniques but also enjoys statistical guarantees, which include a controlled
  false positive rate and the expected time to correctly identify a source as an LLM. Experiments
  were conducted to demonstrate the effectiveness of our method.
