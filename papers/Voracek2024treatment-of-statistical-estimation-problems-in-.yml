title: Treatment of Statistical Estimation Problems in Randomized Smoothing for Adversarial Robustness
authors: Václav Voráček
year: 2024
doi: 10.52202/079017-4242
abstract: >-
  Voráček examines the large sampling cost of randomized-smoothing certificates for adversarial
  robustness. Confidence-sequence procedures decide whether a point is robust at a specified radius
  using fewer classifier evaluations while maintaining the required statistical guarantees, and
  the paper establishes optimal sample-complexity behavior for the estimation problem. A randomized
  version of the Clopper-Pearson interval further strengthens the resulting certificates.
