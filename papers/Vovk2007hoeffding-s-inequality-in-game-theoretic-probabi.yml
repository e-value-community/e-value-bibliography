title: Hoeffding's inequality in game-theoretic probability
authors: Vladimir Vovk
year: 2007
arxiv: '0708.2502'
abstract: >-
  This note makes the obvious observation that Hoeffding's original proof of his inequality
  remains valid in the game-theoretic framework. All details are spelled out for the convenience
  of future reference.
