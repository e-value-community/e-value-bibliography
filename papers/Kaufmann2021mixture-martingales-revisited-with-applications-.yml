title: Mixture martingales revisited with applications to sequential tests and confidence intervals
authors: Emilie Kaufmann, Wouter M. Koolen
year: 2021
doi: null
arxiv: '1811.11419'
abstract: >-
  This paper presents new deviation inequalities that are valid uniformly in time under adaptive
  sampling in a multi-armed bandit model. The deviations are measured using the Kullback-Leibler
  divergence in a given one-dimensional exponential family, and may take into account several arms
  at a time. They are obtained by constructing for each arm a mixture martingale based on a
  hierarchical prior, and by multiplying those martingales. Our deviation inequalities allow us to
  analyze stopping rules based on generalized likelihood ratios for a large class of sequential
  identification problems, and to construct tight confidence intervals for some functions of the
  means of the arms.
