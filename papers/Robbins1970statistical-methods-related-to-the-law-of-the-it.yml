title: Statistical Methods Related to the Law of the Iterated Logarithm
authors: Herbert Robbins
year: 1970
doi: 10.1214/aoms/1177696786
abstract: >-
  1. Extension and applications of an inequality of Ville and Wald. Let x 1… be a sequence of
  random variables with a specified joint probability distribution P. We shall give a method for
  obtaining probability inequalities and related limit theorems concerning the behavior of the
  entire sequence of x’s.
