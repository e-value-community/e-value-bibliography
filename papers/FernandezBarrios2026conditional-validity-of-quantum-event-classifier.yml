title: Information and reference requirements for auditing collider classifiers
authors: Roberto Fernández-Barrios, Iker Pastor-López, Asier González-Santocildes, Pablo García Bringas
year: 2026
arxiv: '2609.02781'
abstract: >-
  Assertions about collider classifiers require observable evidence and a specified deployment
  reference. We distinguish the classification threshold that selects events from the claim
  threshold that defines acceptable performance. For fixed nominal-weighted ratio claims on a
  frozen finite population, we apply established assorter reductions and bounded-mean confidence
  sequences under independent sampling with replacement and a predeclared weight bound. The
  anytime-valid error control is per claim, not automatically simultaneous across claims, and is
  not a new statistical guarantee. In 19,680 archived paired audit-stream comparisons, changing
  unweighted correctness and its source reference to nominal-weighted accuracy and its own
  reference changed 536 supported verdicts to unresolved and 226 in the reverse direction. Scores,
  labels, weights and exact ratios were available before these simulated audits; their stopping
  times demonstrate no operational acquisition saving. A post hoc analysis of 30 finite-shot
  quantum-kernel realizations, with paired RAW and diagonal-loading treatments, describes
  sensitivity to operating rules, ideal versus realized references, and fixed versus recomposed
  margin groups. Verdict differences are not auditor error rates, and no quantum-specific
  mechanism or quantum advantage is established. A CMS open-data example supports restricted
  aggregate statements while event-level accuracy remains unidentified. This substantial revision
  withdraws the previous physical-interval coverage conclusions following numerical-validation
  problems; the available reevaluation does not reestablish them. The retained contribution is
  mathematical exposition and descriptive evidence, without methodological-priority or calibrated
  physical-inference claims.
