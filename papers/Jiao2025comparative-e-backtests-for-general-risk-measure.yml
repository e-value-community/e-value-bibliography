title: Comparative e-backtesting
authors: Zhanyi Jiao, Qiuqi Wang, Yimiao Zhao
year: 2025
arxiv: '2511.05840'
abstract: >-
  Backtesting risk measures is a central task in financial regulation. While traditional
  backtests evaluate whether a forecasting model is statistically consistent with observed
  losses, regulatory practice often requires assessing the performance of an internal model
  relative to standard models. In this paper, we develop a parametric anytime-valid framework
  for comparative backtests of general risk measures using e-values and e-processes. We
  construct likelihood-based e-processes for comparative e-backtests with validity and power
  guarantees. As practical guidelines, we propose the e-three-zone approach based on weak
  dominance, and introduce the overall and resetting test schemes for different practical
  purposes. Simulation studies and empirical analyses are conducted to show practical
  manipulations in financial regulation.
