title: 'SLICE: Sequential Likelihood-Free Inference via Conformal E-Values'
authors: Stefano Cortinovis, Laura Battaglia, François Caron
year: 2026
arxiv: '2610.13855'
abstract: >-
  Many scientific models can be simulated but have intractable likelihoods, making frequentist
  uncertainty quantification difficult. We construct exact anytime-valid confidence sequences for
  the parameters of such models. At each observation, fresh simulations from each candidate null
  conformalize a positive predictable score into a conditional e-value; their product is a test
  martingale, which we invert over the parameter. Validity holds for any such score, whatever its
  accuracy. We show that the oracle likelihood-ratio score maximizes expected log growth, which
  motivates approximating it with an amortized neural ratio estimator. On synthetic benchmarks, an
  audit of model routing in an LLM API, and microlensing data, the resulting confidence sequences
  stay valid under continuous monitoring, where fixed-sample methods do not, and neural scores
  remain competitive with exact likelihood ratios and application-specific scores.
