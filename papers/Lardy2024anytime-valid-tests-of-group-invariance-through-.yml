title: Anytime-Valid Tests of Group Invariance through Conformal Prediction
authors: Tyron Lardy, Muriel Felipe Pérez-Ortiz
year: 2024
arxiv: '2401.15461'
abstract: >-
  We develop anytime-valid tests of invariance under the action of compact groups. The resulting
  test statistics are optimal in a logarithmic-growth sense. We apply our method to extend recent
  anytime-valid tests of independence and to construct tests of normality.
