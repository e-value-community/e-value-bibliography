title: Root Cause Analysis of Outliers in Unknown Cyclic Graphs
authors: Daniela Schkoda, Dominik Janzing
year: 2025
arxiv: '2510.06995'
abstract: >-
  We study the propagation of outliers in cyclic causal graphs with linear structural equations,
  tracing them back to one or several "root cause" nodes. We show that it is possible to identify
  a short list of potential root causes provided that the perturbation is sufficiently strong and
  propagates according to the same structural equations as in the normal mode. This shortlist
  consists of the true root causes together with those of its parents lying on a cycle with the
  root cause. Notably, our method does not require prior knowledge of the causal graph and yields
  encouraging results on simulated data and real data from biology and cloud computing.
