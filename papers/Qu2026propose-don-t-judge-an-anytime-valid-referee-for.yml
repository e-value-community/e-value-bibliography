title: 'Propose, Don''t Judge: An Anytime-Valid Referee for LLM Agents That Mine Investment Factors'
authors: Bo Qu, Mingguang Chen, Licheng Wang
year: 2026
arxiv: '2609.27051'
abstract: >-
  Language-model agents now run the whole of quantitative factor research: they propose investment
  factors, backtest them, select the survivors and retire them. We ask which of those jobs an
  agent should keep. Our answer is governed self-evolution: the agent may propose, and a frozen
  statistical referee that the agent cannot touch must judge. The referee scores each candidate
  only on market outcomes revealed after submission, by betting, so its false-discovery guarantee
  holds at every stopping time for any proposal policy. We cross three proposers (a script, a
  bandit and a language model) with this referee and with three deliberately leaky ones, in a
  synthetic world with planted truth, a probe-authoring environment and a ten-year walk-forward on
  the CSI 500. Who judges sets the number of false admissions: the frozen referee admits 5-11
  times fewer sub-threshold factors than the leaky referees under a scripted proposer, and no
  proposer closes that gap. Who proposes sets the yield: the language model beats the script,
  matches the bandit, and adds the one capability a bandit lacks, writing its own diagnostic
  probes. The certificate's price is time: an admitted true factor waits about 500 trading days,
  and the certified portfolio's Sharpe ratio therefore trails an ungated one. Judging belongs to
  the procedure; proposing and instrument-making belong to the agent.
