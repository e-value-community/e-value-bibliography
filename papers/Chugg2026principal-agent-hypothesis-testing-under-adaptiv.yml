title: Principal-agent hypothesis testing under adaptive experimentation
authors: Ben Chugg, Aritra Ghosh, Aaditya Ramdas
year: 2026
arxiv: '2610.38872'
abstract: >-
  Principal-agent hypothesis testing studies statistical contracts in which a principal rewards an
  agent according to data the agent generates. Existing work focuses on the single-shot setting,
  where the agent produces a single dataset. We extend the framework to sequential settings, where
  evidence accumulates over time, rewards may be deferred to the end or disbursed incrementally,
  and the agent may stop the contract at a strategically chosen stopping time. We call a contract
  null-deterring if no ''null agent'' (those whose data-generating distribution lies in the null
  hypothesis) can profit in expectation under any stopping rule, and our main conceptual result
  shows that such contracts are characterized by e-processes. We then turn to the agent's best
  response and identify the optimal stopping rule through the Snell envelope of the reward
  process. We develop simpler, more interpretable approximations that often require the agent to
  have only partial knowledge of its distribution.
