title: Sequential tests for composite hypotheses
authors: D. R. Cox
year: 1952
doi: 10.1017/s030500410002764x
abstract: >-
  Abstract A method is given for obtaining sequential tests in the presence of nuisance
  parameters. It is assumed that a jointly sufficient set of estimators exists for the unknown
  parameters. A number of special tests are described and their properties discussed.
