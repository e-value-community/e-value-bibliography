title: Sequential testing of conditionally constrained hypotheses
authors: Eugenio Clerico
year: 2026
arxiv: '2606.06769'
abstract: >-
  We characterise e-processes for testing non-parametric hypotheses that require the
  conditional mean of a finite-dimensional statistic to lie in a prescribed convex set. Our
  main result is a complete-class theorem: every such e-process is pointwise dominated by a
  predictable product of affine one-step e-variables. Consequently, restricting to test
  supermartingales entails no loss: at any rejection threshold, the dominating process rejects
  no later on any observation path. We further show that a minimal complete class exists and
  consists of predictable products of maximal affine one-step e-variables. These results extend
  previous complete-class results from single-step constrained testing and bounded
  one-dimensional conditional mean testing to a broader conditional sequential setting.
