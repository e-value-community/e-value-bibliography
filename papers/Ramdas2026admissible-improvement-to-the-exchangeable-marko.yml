title: Admissible improvement to the exchangeable Markov inequality with statistical applications
authors: Aaditya Ramdas
year: 2026
abstract: >-
  The exchangeable Markov inequality of Ramdas and Manole controls the probability that a prefix
  average of nonnegative exchangeable observations crosses a threshold. We show that the
  inequality can be uniformly improved. Applications include improved Chebyshev and Chernoff
  inequalities under exchangeability, more powerful repeated-split universal inference, and
  smaller p-value combinations. For the exchangeable R\"uger family, we obtain fully admissible
  monotone mergers with polynomial preprocessing and sorting-time evaluation. For other mergers,
  we give inexpensive strict refinements, but we explain a computational obstruction to generic
  exact permutation algorithms.
