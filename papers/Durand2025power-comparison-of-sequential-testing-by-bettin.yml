title: Power comparison of sequential testing by betting procedures
authors: Amaury Durand, Olivier Wintenberger
year: 2025
arxiv: '2504.00593'
abstract: >-
  In this paper, we derive power guarantees of some sequential tests for bounded mean under
  general alternatives. We focus on testing procedures using nonnegative supermartingales which
  are anytime valid and consider alternatives which coincide asymptotically with the null (e.g.
  vanishing mean) while still allowing to reject in finite time. Introducing variance constraints,
  we show that the alternative can be broaden while keeping power guarantees for certain
  second-order testing procedures. We also compare different test procedures in multidimensional
  setting using characteristics of the rejection times. Finally, we extend our analysis to other
  functionals as well as testing and comparing forecasters. Our results are illustrated with
  numerical simulations including bounded mean testing and comparison of forecasters.
