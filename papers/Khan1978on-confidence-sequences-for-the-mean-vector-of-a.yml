title: On confidence sequences for the mean vector of a multivariate normal distribution
authors: Rasul A Khan
year: 1978
doi: 10.1016/0047-259x(78)90032-5
abstract: >-
  Let X₁, X₂,… be iid random vectors with a multivariate normal distribution N(μ, Σ). A sequence
  of subsets {Rₙ(a₁, a₂,…, aₙ), n ≥ m} of the space of μ is said to be a (1 − α)-level sequence of
  confidence sets for μ if P(μ ∈ Rₙ(X₁, X₂,…, Xₙ) for every n ≥ m) ≥ 1 − α. In this note we use
  the ideas of Robbins Ann. Math. Statist. 41 (1970) to construct confidence sequences for the
  mean vector μ when Σ is either known or unknown. The constructed sequence Rₙ(X₁, X₂, …, Xₙ)
  depends on Mahalanobis' or Hotelling's according as Σ is known or unknown. Confidence sequences
  for the vector-valued parameter in the general linear model are also given.
