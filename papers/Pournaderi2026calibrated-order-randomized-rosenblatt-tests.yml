title: Calibrated Order-Randomized Rosenblatt Tests
authors: Mehrdad Pournaderi
year: 2026
arxiv: '2609.37477'
abstract: >-
  We test whether a multivariate vector X conforms to a specified distribution F, as in copula
  modelling and density forecasting. The Rosenblatt transform reduces this to testing
  uniformity, but its arbitrary coordinate ordering affects power under dependence. We study
  order randomization: transforming under many random orderings and merging evidence with
  dependence-robust rules. Reordering only redistributes the Mahalanobis signal energy, so one
  ordering is a lucky or unlucky draw, and pooling raises calibrated power. We compare against
  two order-invariant baselines, the chi-squared energy test and the symmetric-root test. With
  F known, the e-value average over orderings is at least as powerful as the symmetric-root
  test in every setting we ran, and as the chi-squared test on concentrated and fully diffuse
  departures. With Gaussian mean and covariance estimated, the classical conditional
  probability integral transform keeps each ordering's p-values exact and e-values valid, a
  parametric bootstrap calibrates the pooled tests, and the comparisons hold except for
  deficits of at most 0.02 against the symmetric-root test on single-coordinate departures.
  Validating a Gaussian risk model for nine currencies, the test flags Brexit, COVID and other
  episodes; it extends to any null with computable, simulable conditionals.
