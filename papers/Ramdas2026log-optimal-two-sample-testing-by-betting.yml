title: Log-optimal two-sample testing by betting
authors: Aaditya Ramdas
year: 2026
arxiv: '2611.19062'
abstract: >-
  For each standard Borel observation space, we construct a single anytime-valid two-sample
  procedure that is asymptotically log-optimal for every pair of unknown probability laws and
  every limiting ratio of diverging sample sizes, including zero and infinity. For independent
  balanced pairs, the optimal log-wealth rate is $2\JS(P,Q)$, where $\JS$ is the
  Jensen--Shannon divergence. Unequal sizes yield weighted Jensen--Shannon information and the
  one-sample limit $\log W(n_1,n_2)/n_2\to\KL(Q\|P)$ when $n_1/n_2\to\infty$. Refining finite
  partitions and logarithmic-loss learning with measurable characteristic kernels provide
  universal constructions. Our main contribution is the generality of our construction, and its
  connections to classical batch efficiency notions. Practical implementations allow continuous
  classifier fine-tuning, as demonstrated on finite alphabets, Gaussian data, and handwritten
  digits.
