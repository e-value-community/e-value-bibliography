title: Exchangeability and randomness for infinite and finite sequences
authors: Vladimir Vovk
year: 2025
abstract: >-
  Randomness (in the sense of being generated in an IID fashion) and exchangeability are standard
  assumptions in nonparametric statistics and machine learning, and relations between them have
  been a popular topic of research. This short paper draws the reader's attention to the fact
  that, while for infinite sequences of observations the two assumptions are almost
  indistinguishable, the difference between them becomes very significant for finite sequences of
  a given length.
