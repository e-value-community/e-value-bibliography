title: Detecting Label Shift for Large Language Models with Conformal Test Martingales
authors: Henrik Boström
year: 2026
abstract: >-
  We study the problem of detecting label shift in deployed Large Language Models (LLMs), using
  model outputs, in the form of class labels, confidence estimates, and justifications, as proxies
  for true labels. We propose the use of conformal test martingales, which can detect shifts in
  both mean and dispersion across multiple streams while controlling the false alarm rate. We
  evaluate the approach on three binary and three multiclass text classification datasets using
  LLMs ranging from 3B to 32B parameters. We consider three martingale algorithms: Simple Jumper,
  Sleeper/Stayer, and Sleeper/Drifter, as well as their composite. The observed false alarm rates
  are consistently below the nominal level. Detection-time rankings are stable across datasets,
  models, and signals, with Sleeper/Drifter and the composite martingale outperforming the others,
  while Simple Jumper is least competitive. The composite provides only marginal gains over
  Sleeper/Drifter alone. Larger models tend to enable earlier detection of label shift, although
  the effect is uneven and non-monotonic. Among the signals, confidence is the most reliable proxy
  for binary datasets, whereas combining all three signals yields the best performance on two
  multiclass datasets. Justification is highly dataset-dependent: it fails for several datasets
  and models, yet is the only effective signal for the smallest model in one case.
