title: 'Not All Mislabels Are Equal: Efficient Task-Aware Auditing with Confidence Sequences'
authors: Fangyuan Lin, Noah Krever, Jakub Černý, Lily Xu
year: 2026
arxiv: '2610.33262'
abstract: >-
  We study efficient, adaptive auditing of categorical labels in a fixed dataset, motivated by
  biodiversity credit programs in which expert verification of species records is costly and
  downstream scores (e.g., payment) are more sensitive to errors on certain labels than on
  others. Our proposed ATLAS framework couples anytime-valid inference with a task-aware
  adaptive auditing policy. Representing label corrections through a confusion matrix, we
  prioritize which data points to inspect next based on both label uncertainty and the
  influence of potential label corrections on the downstream score function. In our main case
  study on Kenyan biodiversity data, task-aware auditing reduces the expert review needed to
  estimate both the mislabel rate and the nonlinear biodiversity score while maintaining
  anytime-valid guarantees. We also evaluate ATLAS on public datasets for image classification
  and named-entity recognition. Across our experiments with linear and nonlinear scores, ATLAS
  generally reaches the same precision as competing anytime-valid methods with substantially
  fewer audits. When distribution-free guarantees are prohibitively costly, we develop a
  model-based Bayesian alternative that can further reduce the number of audits by relying on
  modeling assumptions. Our biodiversity case study highlights a gap between statistical
  validity and practical feasibility: generic methods such as Serfling's bound and existing
  confidence-sequence procedures are rigorous but can require prohibitively many expert reviews
  in practice. Together, these results show task-aware auditing can significantly reduce the
  number of expert audits needed while providing finite-sample, anytime-valid guarantees
