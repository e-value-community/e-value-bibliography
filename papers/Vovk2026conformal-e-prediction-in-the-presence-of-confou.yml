title: Conformal e-prediction in the presence of confounding
authors: Vladimir Vovk, Ruodu Wang
year: 2026
arxiv: '2603.11134'
abstract: >-
  This note extends conformal e-prediction to cover the case where there is observed confounding
  between the random object $X$ and its label $Y$. We consider both the case where the observed
  data is IID and a case where some dependence between observations is permitted.
