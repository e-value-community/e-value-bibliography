title: Time-uniform, nonparametric, nonasymptotic confidence sequences
authors: Steven R. Howard, Aaditya Ramdas, Jon McAuliffe, Jasjeet Sekhon
year: 2021
doi: 10.1214/20-AOS1991
arxiv: '1810.08240'
abstract: >-
  A confidence sequence is a sequence of confidence intervals that is uniformly valid over an
  unbounded time horizon. Our work develops confidence sequences whose widths go to zero, with
  nonasymptotic coverage guarantees under nonparametric conditions. We draw connections between
  the Cramér-Chernoff method for exponential concentration, the law of the iterated logarithm
  (LIL), and the sequential probability ratio test -- our confidence sequences are time-uniform
  extensions of the first; provide tight, nonasymptotic characterizations of the second; and
  generalize the third to nonparametric settings, including sub-Gaussian and Bernstein conditions,
  self-normalized processes, and matrix martingales. We illustrate the generality of our proof
  techniques by deriving an empirical-Bernstein bound growing at a LIL rate, as well as a novel
  upper LIL for the maximum eigenvalue of a sum of random matrices. Finally, we apply our methods
  to covariance matrix estimation and to estimation of sample average treatment effect under the
  Neyman-Rubin potential outcomes model.
