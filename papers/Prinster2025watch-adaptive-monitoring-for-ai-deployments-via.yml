title: 'WATCH: Adaptive Monitoring for AI Deployments via Weighted-Conformal Martingales'
authors: Drew Prinster, Xing Han, Anqi Liu, Suchi Saria
year: 2025
arxiv: '2505.04608'
abstract: >-
  Responsibly deploying artificial intelligence (AI) / machine learning (ML) systems in
  high-stakes settings arguably requires not only proof of system reliability, but also continual,
  post-deployment monitoring to quickly detect and address any unsafe behavior. Methods for
  nonparametric sequential testing -- especially conformal test martingales (CTMs) and
  anytime-valid inference -- offer promising tools for this monitoring task. However, existing
  approaches are restricted to monitoring limited hypothesis classes or ``alarm criteria'' (e.g.,
  detecting data shifts that violate certain exchangeability or IID assumptions), do not allow for
  online adaptation in response to shifts, and/or cannot diagnose the cause of degradation or
  alarm. In this paper, we address these limitations by proposing a weighted generalization of
  conformal test martingales (WCTMs), which lay a theoretical foundation for online monitoring for
  any unexpected changepoints in the data distribution while controlling false-alarms. For
  practical applications, we propose specific WCTM algorithms that adapt online to mild covariate
  shifts (in the marginal input distribution), quickly detect harmful shifts, and diagnose those
  harmful shifts as concept shifts (in the conditional label distribution) or extreme
  (out-of-support) covariate shifts that cannot be easily adapted to. On real-world datasets, we
  demonstrate improved performance relative to state-of-the-art baselines.
