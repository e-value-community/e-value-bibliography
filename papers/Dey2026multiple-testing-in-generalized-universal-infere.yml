title: Multiple Testing in Generalized Universal Inference
authors: Neil Dey, Ryan Martin, Jonathan P. Williams
year: 2026
doi: 10.1016/j.spl.2025.110559
arxiv: '2412.01008'
abstract: >-
  Compared to p-values, e-values provably guarantee safe, valid inference. If the goal is to test
  multiple hypotheses simultaneously, one can construct e-values for each individual test and then
  use the recently developed e-BH procedure to properly correct for multiplicity. Standard e-value
  constructions, however, require distributional assumptions that may not be justifiable. This
  paper demonstrates that the generalized universal inference framework can be used along with the
  e-BH procedure to control frequentist error rates in multiple testing when the quantities of
  interest are minimizers of risk functions, thereby avoiding the need for distributional
  assumptions. We demonstrate the validity and power of this approach via a simulation study,
  testing the significance of a predictor in quantile regression.
