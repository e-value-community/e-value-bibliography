title: A New Interpretation of Information Rate
authors: J. L. Kelly
year: 1956
doi: 10.1002/j.1538-7305.1956.tb03809.x
abstract: >-
  If the input symbols to a communication channel represent the outcomes of a chance event on
  which bets are available at odds consistent with their probabilities (i.e., “fair” odds), a
  gambler can use the knowledge given him by the received symbols to cause his money to grow
  exponentially. The maximum exponential rate of growth of the gambler's capital is equal to the
  rate of transmission of information over the channel. This result is generalized to include the
  case of arbitrary odds. Thus we find a situation in which the transmission rate is significant
  even though no coding is contemplated. Previously this quantity was given significance only by a
  theorem of Shannon's which asserted that, with suitable encoding, binary digits could be
  transmitted over the channel at this rate with an arbitrarily small probability of error.
